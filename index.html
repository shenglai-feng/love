<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>给你的小心意</title>
  <style>
    * { margin: 0; padding: 0; overflow: hidden; background: #0d0d0d; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 心形参数方程
    function heart(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) + 5 * Math.cos(2*t) + 2 * Math.cos(3*t) + Math.cos(4*t));
      return { x, y };
    }

    class HeartParticle {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.progress = init ? Math.random() : 0;
        this.size = Math.random() * 10 + 15; // 爱心变大
        this.speed = Math.random() * 0.005 + 0.001;
        // 颜色改为暖色系（红、粉、橙）
        const hue = Math.random() * 40 + 330; 
        this.color = `hsl(${hue}, 100%, 65%)`;
        this.pos = { x: Math.random() * canvas.width, y: canvas.height + 50 };
        this.opacity = 1;
      }
      update() {
        this.progress += this.speed;
        this.pos.y = canvas.height - this.progress * canvas.height * 1.5;
        this.pos.x += Math.sin(this.progress * Math.PI * 4) * 1.5; // 左右飘动
        if (this.pos.y < -50) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        // 动态旋转
        ctx.rotate(Math.sin(this.progress * 10) * 0.2);
        ctx.scale(this.size / 20, this.size / 20);
        ctx.beginPath();
        for (let t = 0; t < 2 * Math.PI; t += 0.01) {
          const { x, y } = heart(t);
          ctx.lineTo(x, y);
        }
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    const hearts = Array.from({ length: 50 }, () => new HeartParticle());

    function drawName() {
      ctx.save();
      ctx.font = 'bold 36px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255, 50, 50, 0.8)';
      ctx.shadowBlur = 20;
      // 文字居中显示
      ctx.fillText('❤️ 给你 ❤️', canvas.width / 2, canvas.height / 2);
      ctx.restore();
    }

    function animate() {
      // 使用半透明填充代替清空画布，制造流星拖尾效果
      ctx.fillStyle = 'rgba(13, 13, 13, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      hearts.forEach(h => { h.update(); h.draw(); });
      drawName();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
